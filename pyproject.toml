[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "river-read-support"
version = "0.1.0"
description = "Read-level Integration for Variant Evidence Recovery"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = ["pysam>=0.22"]

[project.scripts]
river = "river.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
